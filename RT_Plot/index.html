<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DSM Live Scope</title>
<style>
  :root {
    --bg: #0c0f0a;
    --panel: #12160f;
    --grid: #1e2419;
    --text: #c8d6c0;
    --dim: #5c6b54;
    --accent: #7fd858;
    --warn: #d8a857;
    --border: #263120;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "Consolas", monospace;
    font-size: 13px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
    margin-right: 8px;
  }
  .field { display: flex; align-items: center; gap: 6px; }
  label { color: var(--dim); font-size: 12px; }
  input[type=text], input[type=number] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 12px;
    width: 130px;
  }
  input[type=number] { width: 70px; }
  button {
    background: var(--accent);
    color: #0c0f0a;
    border: none;
    padding: 5px 14px;
    border-radius: 3px;
    font-family: inherit;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
  }
  button:disabled { background: var(--border); color: var(--dim); cursor: default; }
  button.stop { background: var(--warn); }
  .status { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5c3030; }
  .dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .stats { color: var(--dim); font-size: 11px; display: flex; gap: 14px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .stats b { color: var(--text); }
  main { padding: 16px; }
  .legend { display: flex; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; user-select: none; }
  .legend .sw { width: 12px; height: 3px; border-radius: 2px; }
  .legend .item.off { opacity: 0.3; }
  canvas {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 100%;
    max-width: 1100px;
  }
</style>
</head>
<body>

<header>
  <h1>DSM Live Scope</h1>
  <div class="field">
    <label>WS URL</label>
    <input type="text" id="wsUrl" value="ws://localhost:8080">
  </div>
  <div class="field">
    <label>Samples</label>
    <input type="number" id="sampleCount" value="500" min="20" max="5000" step="20">
  </div>
  <button id="connectBtn">Connect</button>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">disconnected</span>
  </div>
</header>

<div class="stats">
  <span>packets: <b id="statPackets">0</b></span>
  <span>dropped batches: <b id="statDropped">0</b></span>
  <span>rate: <b id="statRate">0</b> pkt/s</span>
</div>

<main>
  <div class="legend" id="legend"></div>
  <canvas id="scope" width="1100" height="480"></canvas>
</main>

<script>
const CHANNELS = [
  { key: "adc_in",   label: "adc_in",   color: "#7fd858" },
  { key: "fgen_out", label: "fgen_out", color: "#58b5d8" },
  { key: "filt_x",   label: "filt_x",   color: "#d8a857" },
  { key: "filt_y",   label: "filt_y",   color: "#d858c4" },
  { key: "dac0",     label: "dac0",     color: "#d85858" },
  { key: "dac1",     label: "dac1",     color: "#a0d858" },
];

const canvas = document.getElementById("scope");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const enabled = new Set(CHANNELS.map(c => c.key));
const legendEl = document.getElementById("legend");

CHANNELS.forEach(ch => {
  const item = document.createElement("div");
  item.className = "item";
  item.innerHTML = `<span class="sw" style="background:${ch.color}"></span>${ch.label}`;
  item.onclick = () => {
    if (enabled.has(ch.key)) { enabled.delete(ch.key); item.classList.add("off"); }
    else { enabled.add(ch.key); item.classList.remove("off"); }
    if (lastFrame) draw(lastFrame);
  };
  legendEl.appendChild(item);
});

let worker = new Worker("worker.js");
let lastFrame = null;
let packetCountWindow = [];

const connectBtn = document.getElementById("connectBtn");
const wsUrlInput = document.getElementById("wsUrl");
const sampleCountInput = document.getElementById("sampleCount");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const statPackets = document.getElementById("statPackets");
const statDropped = document.getElementById("statDropped");
const statRate = document.getElementById("statRate");

let connected = false;

connectBtn.onclick = () => {
  if (!connected) {
    worker.postMessage({ type: "setSampleCount", sampleCount: parseInt(sampleCountInput.value, 10) });
    worker.postMessage({ type: "connect", url: wsUrlInput.value });
    connectBtn.textContent = "Disconnect";
    connectBtn.classList.add("stop");
  } else {
    worker.postMessage({ type: "disconnect" });
    connectBtn.textContent = "Connect";
    connectBtn.classList.remove("stop");
  }
};

// Sample count can change live; worker resets its buffer when it does.
sampleCountInput.addEventListener("change", () => {
  const n = Math.max(20, Math.min(5000, parseInt(sampleCountInput.value, 10) || 500));
  sampleCountInput.value = n;
  worker.postMessage({ type: "setSampleCount", sampleCount: n });
});

worker.onmessage = (ev) => {
  const msg = ev.data;
  if (msg.type === "status") {
    connected = msg.connected;
    statusDot.classList.toggle("live", connected);
    statusText.textContent = connected ? "live" : (msg.error ? `error: ${msg.error}` : "disconnected");
    if (!connected) {
      connectBtn.textContent = "Connect";
      connectBtn.classList.remove("stop");
    }
  } else if (msg.type === "frame") {
    lastFrame = msg;
    draw(msg);
    updateStats(msg);
  }
};

function updateStats(msg) {
  statPackets.textContent = msg.receivedPackets;
  statDropped.textContent = msg.droppedBatches;

  const now = performance.now();
  packetCountWindow.push({ t: now, n: msg.receivedPackets });
  packetCountWindow = packetCountWindow.filter(e => now - e.t < 2000);
  if (packetCountWindow.length >= 2) {
    const first = packetCountWindow[0], last = packetCountWindow[packetCountWindow.length - 1];
    const dt = (last.t - first.t) / 1000;
    const rate = dt > 0 ? Math.round((last.n - first.n) / dt) : 0;
    statRate.textContent = rate;
  }
}

// Fixed canvas. Y-axis auto-scales per frame to whatever channels are enabled.
function draw(msg) {
  ctx.clearRect(0, 0, W, H);

  // grid
  ctx.strokeStyle = "#1e2419";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const x = (W / 10) * i;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let i = 0; i <= 8; i++) {
    const y = (H / 8) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  const active = CHANNELS.filter(c => enabled.has(c.key));
  if (active.length === 0) return;

  let min = Infinity, max = -Infinity;
  for (const ch of active) {
    const arr = msg.buffers[ch.key];
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] < min) min = arr[i];
      if (arr[i] > max) max = arr[i];
    }
  }
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.1;
  min -= pad; max += pad;

  const n = msg.sampleCount;
  const xStep = W / (n - 1);
  const yScale = H / (max - min);
  const toY = (v) => H - (v - min) * yScale;

  for (const ch of active) {
    const arr = msg.buffers[ch.key];
    ctx.strokeStyle = ch.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < arr.length; i++) {
      const x = i * xStep;
      const y = toY(arr[i]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}
</script>
</body>
</html>

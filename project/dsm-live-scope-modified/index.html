<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSM Live Scope</title>
<style>
  :root {
    --bg: #0c0f0a;
    --panel: #12160f;
    --grid: #1e2419;
    --text: #c8d6c0;
    --dim: #71806a;
    --accent: #7fd858;
    --warn: #d8a857;
    --border: #263120;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "Consolas", monospace;
    font-size: 13px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 8px 0 0;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  label {
    color: var(--dim);
    font-size: 12px;
  }

  input[type=text],
  input[type=number] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 8px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 12px;
  }

  input[type=text] { width: 150px; }
  input[type=number] { width: 80px; }

  button {
    background: var(--accent);
    color: #0c0f0a;
    border: none;
    padding: 6px 14px;
    border-radius: 3px;
    font-family: inherit;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
  }

  button.stop { background: var(--warn); }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #5c3030;
  }

  .dot.live {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }

  .stats {
    color: var(--dim);
    font-size: 11px;
    display: flex;
    gap: 14px;
    padding: 6px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .stats b { color: var(--text); }

  main {
    padding: 16px;
    max-width: 1500px;
    margin: 0 auto;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .section-title {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .legend .item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }

  .legend .sw {
    width: 12px;
    height: 3px;
    border-radius: 2px;
  }

  .legend .item.off { opacity: 0.3; }

  .scope-wrap {
    position: relative;
    width: 100%;
    overflow-x: auto;
  }

  canvas {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 100%;
    min-width: 850px;
    height: auto;
  }

  .table-wrap {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 760px;
  }

  th, td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    white-space: nowrap;
  }

  th:first-child,
  td:first-child {
    text-align: left;
  }

  th {
    color: var(--dim);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: #10140e;
  }

  td {
    font-size: 12px;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .signal-name {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }

  .signal-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .muted {
    color: var(--dim);
  }
</style>
</head>

<body>
<header>
  <h1>DSM Live Scope</h1>

  <div class="field">
    <label>WS URL</label>
    <input type="text" id="wsUrl" value="ws://localhost:8080">
  </div>

  <div class="field">
    <label>Samples</label>
    <input type="number" id="sampleCount" value="500" min="20" max="5000" step="20">
  </div>

  <button id="connectBtn">Connect</button>

  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">disconnected</span>
  </div>
</header>

<div class="stats">
  <span>packets: <b id="statPackets">0</b></span>
  <span>dropped batches: <b id="statDropped">0</b></span>
  <span>rate: <b id="statRate">0</b> pkt/s</span>
</div>

<main>
  <div class="toolbar">
    <div class="section-title">Signals</div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="scope-wrap">
    <canvas id="scope" width="1400" height="600"></canvas>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Signal</th>
          <th>Current</th>
          <th>Min</th>
          <th>Max</th>
          <th>Average</th>
          <th>Delta (Max-Min)</th>
        </tr>
      </thead>
      <tbody id="signalTableBody"></tbody>
    </table>
  </div>
</main>

<script>
const CHANNELS = [
  { key: "adc_in",   label: "adc_in",   color: "#7fd858" },
  { key: "fgen_out", label: "fgen_out", color: "#58b5d8" },
  { key: "filt_x",   label: "filt_x",   color: "#d8a857" },
  { key: "filt_y",   label: "filt_y",   color: "#d858c4" },
  { key: "dac0",     label: "dac0",     color: "#d85858" },
  { key: "dac1",     label: "dac1",     color: "#a0d858" },
];

const canvas = document.getElementById("scope");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const PLOT = {
  left: 70,
  right: 20,
  top: 20,
  bottom: 42
};

const enabled = new Set(CHANNELS.map(c => c.key));
const legendEl = document.getElementById("legend");
const tableBody = document.getElementById("signalTableBody");

const connectBtn = document.getElementById("connectBtn");
const wsUrlInput = document.getElementById("wsUrl");
const sampleCountInput = document.getElementById("sampleCount");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const statPackets = document.getElementById("statPackets");
const statDropped = document.getElementById("statDropped");
const statRate = document.getElementById("statRate");

const worker = new Worker("worker.js");

let lastFrame = null;
let packetCountWindow = [];
let connected = false;

function formatValue(value) {
  if (!Number.isFinite(value)) return "—";
  if (Number.isInteger(value)) return String(value);
  return value.toFixed(3);
}

CHANNELS.forEach(ch => {
  const item = document.createElement("div");
  item.className = "item";
  item.innerHTML =
    `<span class="sw" style="background:${ch.color}"></span>${ch.label}`;

  item.onclick = () => {
    if (enabled.has(ch.key)) {
      enabled.delete(ch.key);
      item.classList.add("off");
    } else {
      enabled.add(ch.key);
      item.classList.remove("off");
    }

    if (lastFrame) {
      draw(lastFrame);
      updateTable(lastFrame);
    }
  };

  legendEl.appendChild(item);
});

connectBtn.onclick = () => {
  if (!connected) {
    worker.postMessage({
      type: "setSampleCount",
      sampleCount: parseInt(sampleCountInput.value, 10)
    });

    worker.postMessage({
      type: "connect",
      url: wsUrlInput.value
    });

    connectBtn.textContent = "Disconnect";
    connectBtn.classList.add("stop");
  } else {
    worker.postMessage({ type: "disconnect" });
    connectBtn.textContent = "Connect";
    connectBtn.classList.remove("stop");
  }
};

sampleCountInput.addEventListener("change", () => {
  const n = Math.max(
    20,
    Math.min(5000, parseInt(sampleCountInput.value, 10) || 500)
  );

  sampleCountInput.value = n;

  worker.postMessage({
    type: "setSampleCount",
    sampleCount: n
  });
});

worker.onmessage = ev => {
  const msg = ev.data;

  if (msg.type === "status") {
    connected = msg.connected;

    statusDot.classList.toggle("live", connected);

    statusText.textContent = connected
      ? "live"
      : (msg.error ? `error: ${msg.error}` : "disconnected");

    if (!connected) {
      connectBtn.textContent = "Connect";
      connectBtn.classList.remove("stop");
    }

    return;
  }

  if (msg.type === "frame") {
    lastFrame = msg;
    draw(msg);
    updateTable(msg);
    updateStats(msg);
  }
};

function updateStats(msg) {
  statPackets.textContent = msg.receivedPackets;
  statDropped.textContent = msg.droppedBatches;

  const now = performance.now();

  packetCountWindow.push({
    t: now,
    n: msg.receivedPackets
  });

  packetCountWindow =
    packetCountWindow.filter(e => now - e.t < 2000);

  if (packetCountWindow.length >= 2) {
    const first = packetCountWindow[0];
    const last = packetCountWindow[packetCountWindow.length - 1];

    const dt = (last.t - first.t) / 1000;

    const rate = dt > 0
      ? Math.round((last.n - first.n) / dt)
      : 0;

    statRate.textContent = rate;
  }
}

function updateTable(msg) {
  tableBody.innerHTML = "";

  for (const ch of CHANNELS) {
    const stats = msg.stats[ch.key];

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <span class="signal-name">
          <span class="signal-dot" style="background:${ch.color}"></span>
          ${ch.label}
        </span>
      </td>
      <td>${formatValue(stats.current)}</td>
      <td>${formatValue(stats.min)}</td>
      <td>${formatValue(stats.max)}</td>
      <td>${formatValue(stats.average)}</td>
      <td>${formatValue(stats.delta)}</td>
    `;

    tableBody.appendChild(tr);
  }
}

function draw(msg) {
  ctx.clearRect(0, 0, W, H);

  const plotW = W - PLOT.left - PLOT.right;
  const plotH = H - PLOT.top - PLOT.bottom;

  const active = CHANNELS.filter(c => enabled.has(c.key));

  drawBackground(plotW, plotH);

  if (active.length === 0) {
    drawText("No signals enabled", W / 2, H / 2, "center");
    return;
  }

  let min = Infinity;
  let max = -Infinity;

  for (const ch of active) {
    const arr = msg.buffers[ch.key];

    for (let i = 0; i < arr.length; i++) {
      const v = arr[i];

      if (v < min) min = v;
      if (v > max) max = v;
    }
  }

  if (min === max) {
    min -= 1;
    max += 1;
  }

  const pad = (max - min) * 0.10;
  min -= pad;
  max += pad;

  drawYAxis(min, max, plotH);

  const n = msg.sampleCount;

  if (n < 2) return;

  const xStep = plotW / (n - 1);
  const yScale = plotH / (max - min);

  const toX = i => PLOT.left + i * xStep;
  const toY = v =>
    PLOT.top + plotH - (v - min) * yScale;

  /*
   * IMPORTANT:
   *
   * This is a zero-order-hold / staircase plot.
   *
   * For every pair of samples:
   *
   *     x[i], y[i]
   *          |
   *          +----------+
   *                     |
   *                     +---------- x[i+1], y[i+1]
   *
   * There is NO diagonal interpolation between samples.
   */
  for (const ch of active) {
    const arr = msg.buffers[ch.key];

    ctx.strokeStyle = ch.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();

    ctx.moveTo(toX(0), toY(arr[0]));

    for (let i = 1; i < arr.length; i++) {
      const x = toX(i);
      const previousY = toY(arr[i - 1]);
      const currentY = toY(arr[i]);

      // Horizontal hold from previous sample.
      ctx.lineTo(x, previousY);

      // Vertical transition at the new sample.
      ctx.lineTo(x, currentY);
    }

    ctx.stroke();
  }

  drawXAxis(n, plotW, plotH);
}

function drawBackground(plotW, plotH) {
  ctx.fillStyle = "#12160f";
  ctx.fillRect(PLOT.left, PLOT.top, plotW, plotH);

  ctx.strokeStyle = "#1e2419";
  ctx.lineWidth = 1;

  const verticalDivisions = 10;
  const horizontalDivisions = 8;

  for (let i = 0; i <= verticalDivisions; i++) {
    const x = PLOT.left + (plotW / verticalDivisions) * i;

    ctx.beginPath();
    ctx.moveTo(x, PLOT.top);
    ctx.lineTo(x, PLOT.top + plotH);
    ctx.stroke();
  }

  for (let i = 0; i <= horizontalDivisions; i++) {
    const y = PLOT.top + (plotH / horizontalDivisions) * i;

    ctx.beginPath();
    ctx.moveTo(PLOT.left, y);
    ctx.lineTo(PLOT.left + plotW, y);
    ctx.stroke();
  }

  ctx.strokeStyle = "#263120";
  ctx.strokeRect(PLOT.left, PLOT.top, plotW, plotH);
}

function drawYAxis(min, max, plotH) {
  ctx.fillStyle = "#71806a";
  ctx.font = '11px "JetBrains Mono", "Consolas", monospace';
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";

  const divisions = 8;

  for (let i = 0; i <= divisions; i++) {
    const ratio = i / divisions;
    const value = max - ratio * (max - min);

    const y = PLOT.top + ratio * plotH;

    ctx.fillText(formatValue(value), PLOT.left - 8, y);
  }
}

function drawXAxis(n, plotW, plotH) {
  ctx.fillStyle = "#71806a";
  ctx.font = '11px "JetBrains Mono", "Consolas", monospace';
  ctx.textAlign = "center";
  ctx.textBaseline = "top";

  const divisions = 10;

  for (let i = 0; i <= divisions; i++) {
    const ratio = i / divisions;
    const sample = Math.round(ratio * (n - 1));
    const x = PLOT.left + ratio * plotW;

    ctx.fillText(String(sample), x, PLOT.top + plotH + 8);
  }

  ctx.fillText(
    "sample",
    PLOT.left + plotW / 2,
    H - 18
  );
}

function drawText(text, x, y, align) {
  ctx.fillStyle = "#71806a";
  ctx.font = '12px "JetBrains Mono", "Consolas", monospace';
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}
</script>
</body>
</html>
